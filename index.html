<!doctype html>
<!-- data-color-mode: the markdown editor (@uiw/react-md-editor) follows the OS theme otherwise; the site is dark only. -->
<html lang="en" data-color-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- One canonical domain (T12): the default Hosting domains send visitors to soulsbuilds.com, keeping the
         path. Exact hosts only, so preview channels (soulsbuilds--pr-….web.app) still work, and Firebase's
         /__/auth/* email-action pages aren't served by this file. -->
    <script>
      if (['soulsbuilds.web.app', 'soulsbuilds.firebaseapp.com'].includes(location.hostname)) {
        location.replace(
          'https://soulsbuilds.com' + location.pathname + location.search + location.hash,
        );
      }
    </script>
    <!-- Start App Check early (T21, T23): without a cached token, Firestore's first request waits for App
         Check's reCAPTCHA chain (enterprise.js, recaptcha__en.js, an iframe, then the token exchange).
         The preload starts enterprise.js at HTML parse instead of after the app bundle runs (~0.1 s sooner).
         Its URL must match what @firebase/app-check injects exactly (RECAPTCHA_ENTERPRISE_URL +
         '?render=explicit'), or it's a wasted download: re-check after SDK upgrades. No crossorigin on
         the script ones (the SDK's script tag has none); the fetch origins need it. -->
    <link
      rel="preload"
      as="script"
      href="https://www.google.com/recaptcha/enterprise.js?render=explicit" />
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="preconnect" href="https://content-firebaseappcheck.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <meta name="theme-color" content="#0d0c0a" />
    <meta
      name="description"
      content="Create, share and discover Elden Ring character builds: stats, weapons, armor, talismans and spells." />
    <!-- Site-level share previews. Per-build previews would need server rendering (backlog). The og:image is
         absolute (crawlers need that), on the canonical domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Souls Builds" />
    <meta property="og:title" content="Souls Builds" />
    <meta
      property="og:description"
      content="Create, share and discover Elden Ring character builds." />
    <meta property="og:url" content="https://soulsbuilds.com/" />
    <meta property="og:image" content="https://soulsbuilds.com/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Souls Builds</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
