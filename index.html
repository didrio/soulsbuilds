<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#131514" />
    <meta
      name="description"
      content="Create, share and discover Elden Ring character builds: stats, weapons, armor, talismans and spells." />
    <!-- Site-level share previews. Per-build previews would need server rendering (backlog). The og:image is
         absolute (crawlers need that); T12 moves it to the custom domain with og:url. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Souls Builds" />
    <meta property="og:title" content="Souls Builds" />
    <meta
      property="og:description"
      content="Create, share and discover Elden Ring character builds." />
    <meta property="og:url" content="https://soulsbuilds.web.app/" />
    <meta property="og:image" content="https://soulsbuilds.web.app/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Souls Builds</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
