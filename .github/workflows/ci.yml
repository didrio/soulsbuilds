name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check

  emulator-tests:
    name: Firestore rules + migration tests, e2e (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Firebase emulators need Java 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The emulator JARs are downloaded on first use; keep them between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-

      - run: npm ci

      - run: npm run test:rules

      # Playwright drives the runner's preinstalled Google Chrome (no browser download).
      - run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: .artifacts/e2e
          retention-days: 7

      # T12 adds deploys to Firebase Hosting preview channels / production.
