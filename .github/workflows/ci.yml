name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not (a production deploy mustn't stop halfway).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Deploys (T12) authenticate with Workload Identity Federation: GitHub's OIDC token is exchanged for
# short-lived credentials of the deploy service account. No JSON keys anywhere. Neither value is a
# secret. Setup and roles: docs/firebase.md "CI deploys".
env:
  GCP_WIF_PROVIDER: projects/981152509260/locations/global/workloadIdentityPools/github/providers/github
  GCP_DEPLOY_SA: github-deploy@soulsbuilds.iam.gserviceaccount.com

jobs:
  check:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The link-preview function's own dependencies (T37): its typecheck (part of the check) needs them.
      - run: npm ci --prefix functions

      - run: npm run check

  emulator-tests:
    name: Firestore rules + migration tests, e2e (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Firebase emulators need Java 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The emulator JARs are downloaded on first use; keep them between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-

      - run: npm ci

      - run: npm run test:rules

      # Playwright drives the runner's preinstalled Google Chrome (no browser download).
      - run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: .artifacts/e2e
          retention-days: 7

  # Every PR from this repo gets a Hosting preview channel (7 days) and a comment with its URL. Previews
  # use the PRODUCTION backend (real data); once App Check is enforced they can't reach Firestore or
  # Auth (their domains aren't on the reCAPTCHA key), so they're for reviewing the UI. Fork PRs are
  # skipped: they get no OIDC token.
  preview:
    name: Preview channel
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [check, emulator-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: google-github-actions/auth@v3
        with:
          project_id: soulsbuilds
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}

      - id: deploy
        run: |
          node scripts/firebase.mjs hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --expires 7d --project soulsbuilds --json > deploy.json
          node -e "const r = require('./deploy.json'); console.log('url=' + Object.values(r.result)[0].url)" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- firebase-preview -->';
            const body = `${marker}\nPreview: ${process.env.PREVIEW_URL} (${context.payload.pull_request.head.sha.slice(0, 7)}, expires in 7 days)\n\n` +
              'Uses the production backend: real data. UI review only once App Check is enforced.';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  # Pushes to main deploy hosting, rules and indexes after the owner approves the run (the
  # `production` environment has a required reviewer). Rules and indexes ship with the code that
  # needs them; both are tested above.
  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, emulator-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://soulsbuilds.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The Firebase CLI loads functions/ to find the function, so its dependencies must be installed; the
      # functions' predeploy step (firebase.json) bundles it.
      - run: npm ci --prefix functions

      - run: npm run build

      - uses: google-github-actions/auth@v3
        with:
          project_id: soulsbuilds
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}

      - run: >-
          node scripts/firebase.mjs deploy --project soulsbuilds --non-interactive
          --only functions,hosting,firestore:rules,firestore:indexes
